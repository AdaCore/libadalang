include:
  - local: utils/gitlab-ci-common.yml
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: single


stages:
  - single
  - release


variables:
  PUBLISH_TESTPYPI:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Publish the Libadalang wheel to TestPyPI from the default branch"
  LIBADALANG_SETUP:
    value: "27.0"
    description: "Cathod setup to download for the TestPyPI release"


build_and_test:
  extends: .basic
  rules:
    # Run this for merge requests only
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  services:
     - image:pe-base
     - cpu:16
     - mem:16
  stage: single
  script:
    # We frequently push coupled changes to Libadalang and Langkit: when this
    # happens, it is no longer possible to build Libadalang with Langkit's
    # production package for that day. To solve this problem,
    # always pretend that we have Langkit changes in the pipe: Langkit is
    # fairly fast to build anyway.
    - generic_anod_ci --add-dep eng/libadalang/langkit
    - . /tmp/ci_env.sh
    - anod run
        --plan utils/gitlab-ci.plan
        --smart-rebuild
        run_ci

    # We must parse testsuite results with the same version of e3-testsuite
    # that produced them. So we install e3-testsuite using the same sandbox as
    # testing.
    - anod install e3-for-testing
    - eval $(anod printenv e3-for-testing)
    - testsuite_reports

    # Gather Cobertura report files
    - TEST_DIR=$(anod info test libadalang -Qcoverage --show working_dir)
    - cp -r $TEST_DIR/build/coverage-report/cobertura coverage

    # Print metrics for integration in MR summary
    - print-global-coverage coverage/*.xml

    # Display the coverage summary in the job log for convenience
    - cat $TEST_DIR/results/new/comment
  artifacts:
    paths:
      - xunit-*.xml
      - coverage/*.xml
    reports:
      junit: xunit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/*.xml
  coverage: '/^Line Coverage:\s+(\d+\.\d+)$/'


check_issue:
  extends: .check_issue
  stage: single


continuous_builder:
  extends: .cb
  stage: single


publish_testpypi:
  stage: release
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_TESTPYPI == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - task_role_arn:arn:aws:iam::097448436531:role/gitlab-runner-task-roles/LibadalangPublishPyPITaskRole
    - security_group:GitLabRunnerTasksExecPrivilegedSG
    - image:e3
    - cpu:1
  variables:
    TWINE_NON_INTERACTIVE: "1"
  # Set GOOGLE_APPLICATION_CREDENTIALS as a File-type CI/CD variable containing
  # Google credentials JSON (service account key or Workload Identity Federation
  # configuration with service account impersonation). Register the account as a trusted
  # publisher on TestPyPI. Do not configure TWINE_PASSWORD for this job.
  # Override LIBADALANG_SETUP when starting a pipeline if needed.
  script:
    - e3-cli venv /tmp/testpypi-venv
    - /tmp/testpypi-venv/bin/python -m pip install 'twine>=6.2' google-auth requests e3-aws
    - |
      : "${GOOGLE_APPLICATION_CREDENTIALS:?Set the service account credentials File variable}"
      test -r "$GOOGLE_APPLICATION_CREDENTIALS"
    - mkdir -p testpypi-release
    - cd testpypi-release
    - e3-cathod components
        --setup "$LIBADALANG_SETUP"
        --build-date all
        --platform x86_64-linux
        --component libadalang-internal
        --download
    - tar xf "libadalang-internal-${LIBADALANG_SETUP}-x86_64-linux-bin.tar.gz"
    - /tmp/testpypi-venv/bin/python -m twine check
        libadalang-internal-${LIBADALANG_SETUP}-x86_64-linux-bin/stripped_python/libadalang-*.whl
    # Twine reads this variable in GitLab CI and exchanges the Google ID token
    # for a short-lived TestPyPI upload token.
    - |
      TESTPYPI_ID_TOKEN=$(/tmp/testpypi-venv/bin/python - <<'PY'
      import json
      import os
      from urllib.parse import unquote, urlparse

      import google.auth
      from google.auth import impersonated_credentials
      from google.auth.transport.requests import Request
      from google.oauth2.id_token import fetch_id_token

      with open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]) as stream:
          info = json.load(stream)

      if info.get("type") == "external_account":
          url = info.pop("service_account_impersonation_url", None)
          if not url:
              raise ValueError("Federated credentials require service_account_impersonation_url")
          account = unquote(urlparse(url).path).rsplit("/", 1)[-1]
          if not account.endswith(":generateAccessToken"):
              raise ValueError("Invalid service_account_impersonation_url")
          account = account.removesuffix(":generateAccessToken")
          if info.get("subject_token_type") == "urn:ietf:params:aws:token-type:aws4_request":
              from e3.aws import Session

              # The e3 AWS session supports ECS task credentials; Google's
              # loader otherwise falls back to EC2 instance metadata.
              region = "eu-west-1"
              aws_credentials = Session(regions=[region]).to_boto3().get_credentials()
              if aws_credentials is None:
                  raise ValueError("No AWS credentials available for Workload Identity Federation")
              aws_credentials = aws_credentials.get_frozen_credentials()
              os.environ["AWS_REGION"] = region
              os.environ["AWS_ACCESS_KEY_ID"] = aws_credentials.access_key
              os.environ["AWS_SECRET_ACCESS_KEY"] = aws_credentials.secret_key
              if aws_credentials.token:
                  os.environ["AWS_SESSION_TOKEN"] = aws_credentials.token
              else:
                  os.environ.pop("AWS_SESSION_TOKEN", None)
          scopes = ["https://www.googleapis.com/auth/cloud-platform"]
          source, _ = google.auth.load_credentials_from_dict(info, scopes=scopes)
          # Use the federated identity directly to avoid nested impersonation.
          target = impersonated_credentials.Credentials(
              source_credentials=source,
              target_principal=account,
              target_scopes=scopes,
          )
          credentials = impersonated_credentials.IDTokenCredentials(
              target, target_audience="testpypi", include_email=True
          )
          credentials.refresh(Request())
          print(credentials.token)
      else:
          print(fetch_id_token(Request(), "testpypi"))
      PY
      )
      export TESTPYPI_ID_TOKEN
    - /tmp/testpypi-venv/bin/python -m twine upload
        --repository-url https://test.pypi.org/legacy/
        libadalang-internal-${LIBADALANG_SETUP}-x86_64-linux-bin/stripped_python/libadalang-*.whl
